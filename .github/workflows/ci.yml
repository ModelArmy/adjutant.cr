name: CI

on:
  push:
    branches: [main, add-legate]
  pull_request:
    branches: [main]
  # Lets the Windows investigation be re-run on demand without
  # pushing a commit each time.
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, crystal: latest }
          - { os: ubuntu-24.04-arm, crystal: latest }
          - { os: macos-latest, crystal: latest }
          - { os: macos-15-intel, crystal: latest }
          # Two Windows rows on purpose. 1.20 is the version the
          # streaming crash was found on and is kept so the
          # investigation stays reproducible; `latest` answers, for
          # free, whether the crash is already fixed upstream.
          - { os: windows-latest, crystal: "1.20" }
          - { os: windows-latest, crystal: latest }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{matrix.crystal}}

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: |
            lib
            bin/ameba*
          key: ${{ matrix.os }}-shards-${{ hashFiles('**/shard.lock') }}

      # ---- Build debug release and check code quality on all platforms

      - name: Install shards
        run: shards check || shards install

      - name: Run tests
        if: ${{ runner.os != 'Windows' }}
        run: crystal spec

      - name: Try to reproduce Windows streaming crash (non-Windows)
        if: ${{ runner.os != 'Windows' }}
        run: |
          crystal run --debug spec/scratch/win_stream_crash_repro.cr

      - name: Try to reproduce Windows streaming crash (Windows)
        if: ${{ runner.os == 'Windows' }}
        # Never crashed so far — kept as the control. If it ever DOES
        # crash, the bug is reachable without the VM and the whole
        # picture changes.
        continue-on-error: true
        run: |
          crystal run --debug spec/scratch/win_stream_crash_repro.cr
          Write-Host "repro exit code: $LASTEXITCODE"

      - name: Install ProcDump (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: choco install procdump -y --no-progress

      # The crash is a FAIL-FAST (0xC0000409, subcode FATAL_APP_EXIT):
      # the process kills itself during exception unwinding, before
      # any handler runs. Nothing inside the program can observe it —
      # rescuing every exception changed nothing — so a dump is the
      # only way to see the faulting frame, and it will name whichever
      # runtime function called abort/terminate.
      #
      # `-e` waits for an unhandled exception rather than dumping
      # immediately; `-ma` takes a full dump so the fiber stacks are
      # present, which matters because the suspicion is unwinding
      # across a frame belonging to another fiber's machinery.
      #
      # `continue-on-error` so the artifact upload below still runs:
      # the whole point of this step is that it fails.
      - name: Run tests and capture a crash dump (Windows)
        if: ${{ runner.os == 'Windows' }}
        continue-on-error: true
        run: |
          crystal build --debug spec/adjutant/legate/verbs/fetch_stream_spec.cr -o fetch_str_spec.exe
          procdump -accepteula -e -ma -x . .\fetch_str_spec.exe --verbose
          Write-Host "spec exit code: $LASTEXITCODE"

      - name: Upload crash dump (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-dump-crystal-${{ matrix.crystal }}
          path: |
            *.dmp
          if-no-files-found: warn
          retention-days: 7

      # ---- Build and run test scripts

      - name: Setup release environment
        if: ${{ runner.os != 'Windows' }}
        run: mkdir -p bin/release

      - name: Build Release
        if: ${{ runner.os != 'Windows' }}
        run: SHARDS_BIN_PATH=bin/release shards --production build --release

      - name: Run test script runner
        if: ${{ runner.os != 'Windows' }}
        run: bin/release/test_runner

      # ---- format and lint check on Linux only

      - name: Setup ameba (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          mkdir -p bin;
          cp lib/ameba/bin/ameba.cr bin && crystal build -Dpreview_mt -o bin/ameba bin/ameba.cr

      - name: Check formatting (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: crystal tool format; git diff --exit-code src

      - name: Build ameba  (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: mkdir -p bin; cp lib/ameba/bin/ameba.cr bin && crystal build -Dpreview_mt -o bin/ameba bin/ameba.cr

      - name: Run static code analysis (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: bin/ameba src/
