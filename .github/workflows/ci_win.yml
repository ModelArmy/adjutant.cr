name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Windows crash investigation is re-run on demand far more
  # often than it is pushed to.
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, crystal: "1.20" }
          - { os: windows-latest, crystal: latest }

    runs-on: ${{ matrix.os }}
    # A diagnostic job must never be able to hang a runner. Every step
    # below that can block on a subprocess or the network also carries
    # its own tighter ceiling, so a stall is attributed to the step
    # that caused it rather than to the job as a whole.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{matrix.crystal}}

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: |
            lib
            bin/ameba*
          key: ${{ matrix.os }}-shards-${{ hashFiles('**/shard.lock') }}

      # ---- Build debug release and check code quality on all platforms

      - name: Install shards
        run: shards check || shards install

      - name: Install ProcDump (Windows)
        run: choco install procdump -y --no-progress

      # The crash is a FAIL-FAST (0xC0000409, subcode FATAL_APP_EXIT):
      # the process kills itself during exception unwinding, before
      # any handler runs. Nothing inside the program can observe it —
      # rescuing every exception changed nothing — so a dump is the
      # only way to see the faulting frame, and it will name whichever
      # runtime function called abort/terminate.
      #
      # `-e` waits for an unhandled exception rather than dumping
      # immediately; `-ma` takes a full dump so the fiber stacks are
      # present, which matters because the suspicion is unwinding
      # across a frame belonging to another fiber's machinery.
      #
      # `continue-on-error` so the artifact upload below still runs:
      # the whole point of this step is that it fails.
      # TWO binaries, both under ProcDump, because they answer
      # different questions and only one of them is known to crash.
      #
      # The standalone repro is the one we WANT to crash: it uses only
      # Crystal's stdlib, so if it does, the bug can be reported
      # without Adjutant in the picture at all. It has survived every
      # version so far.
      #
      # The spec binary is the one we KNOW crashes. Running it too
      # means a surviving repro still leaves a dump to compare
      # against — otherwise a survived run produces no artifact and no
      # signal, which is exactly what happened on the run before this
      # step was split.
      #
      # `continue-on-error` throughout: these steps are SUPPOSED to
      # fail, and the analysis and upload below must still run.
      - name: Build both binaries (Windows)
        continue-on-error: true
        run: |
          crystal build --debug spec/scratch/win_stream_crash_repro.cr -o win_stream_crash_repro.exe
          crystal build --debug spec/adjutant/legate/verbs/fetch_stream_spec.cr -o fetch_str_spec.exe

      # No `--verbose` here: the repro takes no arguments and prints
      # its own progress table, one line per unwind depth. If it
      # survives, that table IS the result — the last line printed
      # names the deepest configuration that held.
      - name: Standalone repro under ProcDump (Windows)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          procdump -accepteula -e -ma -x repro .\win_stream_crash_repro.exe
          Write-Host "repro exit code: $LASTEXITCODE"

      - name: Known-crashing spec under ProcDump (Windows)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          procdump -accepteula -e -ma -x spec .\fetch_str_spec.exe --verbose
          Write-Host "spec exit code: $LASTEXITCODE"

      # Which of the two produced a dump is itself the headline
      # result, so state it plainly rather than leaving it to be
      # inferred from the artifact listing.
      - name: Summarise what crashed (Windows)
        continue-on-error: true
        run: |
          $repro = @(Get-ChildItem -Path repro -Filter *.dmp -ErrorAction SilentlyContinue)
          $spec  = @(Get-ChildItem -Path spec  -Filter *.dmp -ErrorAction SilentlyContinue)
          Write-Host "standalone repro crashed: $(if ($repro.Count) { 'YES' } else { 'no' })"
          Write-Host "adjutant spec crashed:    $(if ($spec.Count)  { 'YES' } else { 'no' })"
          if (-not $repro.Count -and $spec.Count) {
            Write-Host "-> The repro still does not reproduce it. Compare the two stacks."
          }

      # Analysed ON THE RUNNER rather than by downloading the dump.
      # Everything analysis needs is already here — the exact binary,
      # its PDB, and a Windows debugger — and none of it travels well
      # to another platform. The output is log text, readable in the
      # browser, with no 22MB round trip and no symbol-path fiddling.
      #
      # `!analyze -v` names the faulting frame and the fail-fast
      # subcode. `~*k` dumps EVERY thread's stack, which is the part
      # that actually matters here: the standing theory is an
      # exception unwinding across a boundary belonging to another
      # fiber's machinery, so the crashing thread's stack alone is
      # unlikely to tell the whole story.
      #
      # Read the output with `!analyze`'s own verdict treated
      # sceptically — on a fail-fast it tends to blame whichever frame
      # called abort, which is the symptom. The interesting frames are
      # further up: Crystal's unwinding functions, or an MSVC
      # `terminate`/`__C_specific_handler`.
      # SYMBOLS ARE LOCAL-ONLY, and that is the fix for this step
      # hanging forever. With `_NT_SYMBOL_PATH` unset, `!analyze -v`
      # reaches out to Microsoft's symbol server for ntdll,
      # VCRUNTIME140 and the rest, and on a runner with no configured
      # proxy that fetch can block indefinitely with no output. `.`
      # restricts cdb to the PDB sitting next to our own binary.
      #
      # The cost is that system frames show as `module+0xNNNN` rather
      # than named functions. That is acceptable here: the frames we
      # need named are OURS, and the system side of the faulting stack
      # is already known from the run that did resolve
      # (abort <- FindAndUnlinkFrame <- _C_specific_handler <-
      # RtlUnwindEx). If richer system symbols are wanted later, set
      # the path to `srv*C:\symbols*https://msdl.microsoft.com/download/symbols`
      # and keep the timeout.
      - name: Analyse the crash dumps (Windows)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $dumps = @(Get-ChildItem -Path repro, spec -Filter *.dmp -Recurse -ErrorAction SilentlyContinue)
          if (-not $dumps.Count) {
            Write-Host "Neither binary crashed — no dump to analyse."
            exit 0
          }
          $env:_NT_SYMBOL_PATH = "."
          choco install windbg -y --no-progress
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) {
            $cdb = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -like "*x64*" } |
                    Select-Object -First 1).FullName
          }
          if (-not $cdb) {
            Write-Host "cdb.exe not found; the dump artifact is still uploaded."
            exit 0
          }
          # `-y .` looks for the PDB next to the binary, which is where
          # `crystal build --debug` leaves it. Without symbols every
          # Crystal frame resolves to a bare offset and the whole
          # exercise is pointless.
          # Every dump that exists gets analysed, labelled by which
          # binary produced it, so the two stacks can be read side by
          # side in one log.
          foreach ($dump in $dumps) {
            Write-Host ""
            Write-Host "=============================================================="
            Write-Host "$($dump.Directory.Name): $($dump.Name) ($([math]::Round($dump.Length / 1MB, 1)) MB)"
            Write-Host "=============================================================="
            # Each dump is analysed in its own bounded process, with
            # output tee'd to a file that is uploaded even if cdb
            # wedges: one stuck debugger should cost its own dump, not
            # every dump after it. `-lines` maps frames to source
            # lines, which the --debug PDB supports.
            $log = "$($dump.Directory.Name)-analysis.txt"
            $proc = Start-Process -FilePath $cdb -PassThru -NoNewWindow `
              -ArgumentList @("-z", $dump.FullName, "-y", ".", "-lines",
                              "-c", "!analyze -v; ~*k; q") `
              -RedirectStandardOutput $log
            if (-not $proc.WaitForExit(240000)) {
              Write-Host "cdb did not finish within 4 minutes; killing it."
              $proc.Kill()
            }
            if (Test-Path $log) { Get-Content $log }
          }

      # The PDB rides along with the dump so the artifact stays usable
      # offline — e.g. with `minidump-stackwalk` on macOS or Linux —
      # if the cdb output above turns out to be thin.
      - name: Upload crash dumps (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-dump-crystal-${{ matrix.crystal }}
          path: |
            repro/*.dmp
            spec/*.dmp
            *.pdb
            *.exe
            *-analysis.txt
          if-no-files-found: warn
          retention-days: 7

