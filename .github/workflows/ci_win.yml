name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, crystal: "1.20" }
          - { os: windows-latest, crystal: "1.21" }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{matrix.crystal}}

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: |
            lib
            bin/ameba*
          key: ${{ matrix.os }}-shards-${{ hashFiles('**/shard.lock') }}

      - name: Install shards
        run: shards check || shards install

      # Developer Mode lets a process create symlinks without
      # SeCreateSymbolicLinkPrivilege, which the specs that build
      # symlinked fixtures need.
      - name: Allow unprivileged symlinks
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Build worker_host needed by test specs
        shell: powershell
        env:
          SHARDS_BIN_PATH: "bin/debug"
        run: |
          mkdir bin -ErrorAction SilentlyContinue
          mkdir bin\debug -ErrorAction SilentlyContinue
          shards build worker_host

      # Built and run directly, not through `crystal spec`, which
      # reports any crash as "terminated abnormally" and drops the
      # exit code. The code (0xC0000409 is a fail-fast, 0xC0000005 an
      # access violation) says what kind of crash it was.
      - name: Run supervisor tests, verbose
        shell: pwsh
        run: |
          crystal build -o supervisor_spec.exe spec/adjutant/supervisor_spec.cr
          ./supervisor_spec.exe -v --order 10
          if ($LASTEXITCODE -ne 0) { Write-Host ("exit code 0x{0:X8}" -f $LASTEXITCODE); exit 1 }

      # `fetch_stream_spec.cr`'s raise-mid-walk case is `pending` under
      # `flag?(:windows)` — it hard-crashes the process there. See
      # SCOPE's "Streamed fetch on Windows".
      - name: Run tests
        run: crystal spec
