name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Windows crash investigation is re-run on demand far more
  # often than it is pushed to.
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, crystal: latest }

    runs-on: ${{ matrix.os }}
    # A diagnostic job must never be able to hang a runner.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{matrix.crystal}}

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: |
            lib
            bin/ameba*
          key: ${{ matrix.os }}-shards-${{ hashFiles('**/shard.lock') }}

      # ---- Build debug release and check code quality on all platforms

      - name: Install shards
        run: shards check || shards install

      - name: Install ProcDump (Windows)
        run: choco install procdump -y --no-progress

      # The crash is a FAIL-FAST (0xC0000409, subcode FATAL_APP_EXIT):
      # the process kills itself during exception unwinding, before
      # any handler runs. Nothing inside the program can observe it —
      # rescuing every exception changed nothing — so a dump is the
      # only way to see the faulting frame, and it will name whichever
      # runtime function called abort/terminate.
      #
      # `-e` waits for an unhandled exception rather than dumping
      # immediately; `-ma` takes a full dump so the fiber stacks are
      # present, which matters because the suspicion is unwinding
      # across a frame belonging to another fiber's machinery.
      #
      # `continue-on-error` so the artifact upload below still runs:
      # the whole point of this step is that it fails.
      # TWO binaries, both under ProcDump, because they answer
      # different questions and only one of them is known to crash.
      #
      # The standalone repro is the one we WANT to crash: it uses only
      # Crystal's stdlib, so if it does, the bug can be reported
      # without Adjutant in the picture at all. It has survived every
      # version so far.
      #
      # The spec binary is the one we KNOW crashes. Running it too
      # means a surviving repro still leaves a dump to compare
      # against — otherwise a survived run produces no artifact and no
      # signal, which is exactly what happened on the run before this
      # step was split.
      #
      # `continue-on-error` throughout: these steps are SUPPOSED to
      # fail, and the analysis and upload below must still run.
      # `procdump -x <dir>` does NOT create the directory — it exits
      # with "The directory does not exist" and never launches the
      # target at all. That silently invalidated an earlier run: the
      # standalone repro and the external-server spec were reported as
      # having survived when neither had actually been executed.
      - name: Create dump directories (Windows)
        run: |
          foreach ($d in "repro", "spec", "external") {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

      - name: Build both binaries (Windows)
        continue-on-error: true
        run: |
          crystal build --debug spec/scratch/win_stream_crash_repro.cr -o win_stream_crash_repro.exe
          crystal build --debug spec/adjutant/legate/verbs/fetch_stream_spec.cr -o fetch_str_spec.exe

      # No `--verbose` here: the repro takes no arguments and prints
      # its own progress table, one line per unwind depth. If it
      # survives, that table IS the result — the last line printed
      # names the deepest configuration that held.
      - name: Standalone repro under ProcDump (Windows)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          procdump -accepteula -e -ma -x repro .\win_stream_crash_repro.exe
          Write-Host "procdump exit: $LASTEXITCODE (0 = target ran to completion)"

      - name: Known-crashing spec under ProcDump (Windows)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          procdump -accepteula -e -ma -x spec .\fetch_str_spec.exe --verbose
          Write-Host "procdump exit: $LASTEXITCODE (0 = target ran to completion)"

      # Which of the two produced a dump is itself the headline
      # result, so state it plainly rather than leaving it to be
      # inferred from the artifact listing.
      # THE EXPERIMENT: the crashing spec, with the server moved out
      # of the process and nothing else changed. A static file server
      # in another OS process, serving a 40KB body to match what the
      # in-process handler writes.
      #
      # Python ships on the GitHub Windows image. `-Filter` on the
      # dump directory keeps this run's dumps separate from the other
      # two so the summary below can tell them apart.
      - name: Streamed fetch against an EXTERNAL server (Windows)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force -Path serve | Out-Null
          $bytes = [byte[]]::new(40000)
          [System.IO.File]::WriteAllBytes("serve\big.bin", $bytes)
          $server = Start-Process python -PassThru -WorkingDirectory serve `
            -ArgumentList "-m","http.server","8099"
          try {
            Start-Sleep -Seconds 3
            crystal build --debug spec/scratch/external_server_crash_spec.cr -o external_spec.exe
            $env:ADJUTANT_EXTERNAL_PORT = "8099"
            $env:ADJUTANT_EXTERNAL_PATH = "/big.bin"
            procdump -accepteula -e -ma -x external .\external_spec.exe --verbose
            Write-Host "procdump exit: $LASTEXITCODE (0 = target ran to completion)"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Summarise what crashed (Windows)
        continue-on-error: true
        run: |
          $repro    = @(Get-ChildItem -Path repro    -Filter *.dmp -ErrorAction SilentlyContinue)
          $spec     = @(Get-ChildItem -Path spec     -Filter *.dmp -ErrorAction SilentlyContinue)
          $external = @(Get-ChildItem -Path external -Filter *.dmp -ErrorAction SilentlyContinue)
          Write-Host "standalone repro (in-process server):  $(if ($repro.Count)    { 'CRASHED' } else { 'survived' })"
          Write-Host "adjutant spec    (in-process server):  $(if ($spec.Count)     { 'CRASHED' } else { 'survived' })"
          Write-Host "adjutant spec    (external server):    $(if ($external.Count) { 'CRASHED' } else { 'survived' })"
          Write-Host ""
          if ($spec.Count -and $external.Count) {
            Write-Host "-> Server location is IRRELEVANT. Real deployments are affected;"
            Write-Host "   Windows is blocking, and the upstream report needs no HTTP::Server."
          } elseif ($spec.Count -and -not $external.Count) {
            Write-Host "-> Only the in-process server crashes. Two servers sharing a thread"
            Write-Host "   matters; likely a harness artefact rather than a production risk."
            Write-Host "   Confirm by re-running before trusting it — this crash is a race."
          } elseif (-not $spec.Count) {
            Write-Host "-> The known-crashing spec did NOT crash this run. Nothing below is"
            Write-Host "   conclusive; the race did not fire. Re-run."
          }

      # Analysed ON THE RUNNER rather than by downloading the dump.
      # Everything analysis needs is already here — the exact binary,
      # its PDB, and a Windows debugger — and none of it travels well
      # to another platform. The output is log text, readable in the
      # browser, with no 22MB round trip and no symbol-path fiddling.
      #
      # `!analyze -v` names the faulting frame and the fail-fast
      # subcode. `~*k` dumps EVERY thread's stack, which is the part
      # that actually matters here: the standing theory is an
      # exception unwinding across a boundary belonging to another
      # fiber's machinery, so the crashing thread's stack alone is
      # unlikely to tell the whole story.
      #
      # Read the output with `!analyze`'s own verdict treated
      # sceptically — on a fail-fast it tends to blame whichever frame
      # called abort, which is the symptom. The interesting frames are
      # further up: Crystal's unwinding functions, or an MSVC
      # `terminate`/`__C_specific_handler`.
      # SPLIT OUT of the analysis step so a hang can be attributed:
      # while install and analysis shared a step there was no way to
      # tell whether Chocolatey or cdb was the thing wedging.
      #
      # The GitHub Windows image usually ships the Windows Kits
      # debuggers already, so the install is often unnecessary as well
      # as slow. This looks first and only falls back to Chocolatey.
      - name: Locate a debugger (Windows)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # Separate from the analysis step so a hang or failure here
          # is attributable: while install and analysis shared a step
          # there was no way to tell which had wedged.
          #
          # No Chocolatey. The `windbg` package has been REMOVED from
          # the community feed ("not found with the source(s) listed"),
          # so that call could only ever fail — and it was never
          # needed: the runner image ships cdb at the fixed Windows
          # Kits path, which the last run confirmed.
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) {
            $found = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" `
                       -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like "*x64*" } |
                     Select-Object -First 1
            $cdb = if ($found) { $found.FullName } else { $null }
          }
          if ($cdb) {
            Write-Host "cdb: $cdb"
            "CDB_PATH=$cdb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "No cdb on this image; dumps are still uploaded for offline analysis."
          }

      - name: Analyse the crash dumps (Windows)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $dumps = @(Get-ChildItem -Path repro, spec, external -Filter *.dmp -Recurse -ErrorAction SilentlyContinue)
          if (-not $dumps.Count) {
            Write-Host "Nothing crashed — no dump to analyse."
            exit 0
          }
          if (-not $env:CDB_PATH) {
            Write-Host "No debugger available; dumps are still uploaded."
            exit 0
          }
          $cdb = $env:CDB_PATH

          # LOCAL-ONLY SYMBOLS. With `_NT_SYMBOL_PATH` unset,
          # `!analyze -v` reaches Microsoft's symbol server and can
          # block with no output — the likeliest cause of this step
          # hanging twice. `.` restricts cdb to the PDB beside our own
          # binary, where `crystal build --debug` leaves it. System
          # frames then show as `module+0xNNNN`, which is acceptable:
          # the frames we need named are ours, and the system side of
          # the faulting stack is already known from the run that did
          # resolve.
          $env:_NT_SYMBOL_PATH = "."

          # Every dump gets analysed, labelled by which binary
          # produced it, so the stacks can be read side by side.
          foreach ($dump in $dumps) {
            Write-Host ""
            Write-Host "=============================================================="
            Write-Host "$($dump.Directory.Name): $($dump.Name) ($([math]::Round($dump.Length / 1MB, 1)) MB)"
            Write-Host "=============================================================="
            # Bounded, and logged to a file that is uploaded even if
            # cdb wedges: one stuck debugger should cost its own dump,
            # not every dump after it.
            $log = "$($dump.Directory.Name)-analysis.txt"
            $proc = Start-Process -FilePath $cdb -PassThru -NoNewWindow `
              -ArgumentList @("-z", $dump.FullName, "-y", ".",
                              "-c", "!analyze -v; ~*k; q") `
              -RedirectStandardOutput $log
            if (-not $proc.WaitForExit(240000)) {
              Write-Host "cdb did not finish within 4 minutes; killing it."
              $proc.Kill()
            }
            if (Test-Path $log) { Get-Content $log }
          }

      # The PDB rides along with the dump so the artifact stays usable
      # offline — e.g. with `minidump-stackwalk` on macOS or Linux —
      # if the cdb output above turns out to be thin.
      - name: Upload crash dumps (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-dump-crystal-${{ matrix.crystal }}
          path: |
            repro/*.dmp
            spec/*.dmp
            external/*.dmp
            *.pdb
            *-analysis.txt
            *.exe
          if-no-files-found: warn
          retention-days: 7

