# Grants this directory's scripts read-only access to their own
# `fixtures/` subfolder, in the policy document format (POLICY.md) a
# real embedder writes; nothing here is test-runner-specific syntax.
# `src/test_runner.cr` resolves roots relative to this file's own
# directory, so `fixtures` means `spec/scripts/legate/basics/fixtures`
# wherever `crystal spec` or `ops test` runs from.
grants:
  read:
    roots:
      - fixtures
risk_flow: none
