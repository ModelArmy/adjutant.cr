name: adjutant
version: 0.5.3
license: MPL2

description: >
  A safe Ruby-like scripting interpreter for agent harnesses —
  with a controlled effect boundary, module capability registry,
  and information flow control.

crystal: ">= 1.21"

authors:
  - nogginly@icloud.com

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
  wiretap:
    github: nogginly/wiretap.cr

targets:
  test_runner:
    main: src/test_runner.cr
  run_script:
    main: samples/run_script.cr
  assess_script:
    main: samples/assess_script.cr
